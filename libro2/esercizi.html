<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>练习 — NPI 2 意语学习站</title>

<style data-npi-critical>:root{--ne-red:#C0392B;--ne-red-bright:#E74C3C;--ne-red-dark:#922B21;--ne-orange:#E67E22;--ne-orange-bright:#F39C12;--ne-gold:#F1C40F;--ne-gold-dark:#D4AC0D;--ne-blue:#1A5276;--ne-blue-bright:#2E86C1;--ne-blue-dark:#0E3A53;--ne-cream:#FEF9E7;--ne-cream-dark:#FDEBD0;--ne-light-blue:#D4E6F1;--ne-green:#27AE60;--ne-green-dark:#1E8449;--ne-purple:#8E44AD;--ne-teal:#1ABC9C;--bg:#FDFBF6;--card:#FFFFFF;--text:#2C3E50;--text-soft:#5D6D7E;--line:#E8E2D4;--shadow:0 2px 10px rgba(44,62,80,.07);--shadow-hover:0 8px 24px rgba(44,62,80,.13);--radius:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-text-size-adjust:100%}
.top-nav{position:sticky;top:0;z-index:900;display:flex;align-items:center;gap:18px;padding:12px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-logo{font-weight:800;font-size:1.05rem;color:var(--ne-red-dark);text-decoration:none;white-space:nowrap;letter-spacing:.3px}
.nav-links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav-links a{color:var(--text-soft);text-decoration:none;font-size:.92rem;padding:6px 12px;border-radius:999px;transition:.2s;white-space:nowrap}
.nav-links a:hover{background:var(--ne-cream);color:var(--ne-red)}
.page-section{max-width:1080px;margin:0 auto;padding:28px 20px}
.page-section h2{margin:0 0 16px;font-size:1.35rem;color:var(--ne-red-dark);padding-bottom:8px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--ne-red),var(--ne-gold),transparent) 1}
.page-section h3{margin:20px 0 10px;color:var(--ne-orange);font-size:1.05rem}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:sticky;top:62px;z-index:50}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;background:var(--ne-red);color:#fff;font-size:.92rem;transition:.2s;font-family:inherit}
.btn:hover{background:var(--ne-red-dark)}
.btn.ghost{background:#fff;color:var(--ne-red);border:1px solid var(--ne-red)}
.btn.ghost:hover{background:var(--ne-red);color:#fff}
select.btn{font-family:inherit;cursor:pointer}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ne-cream);font-size:.82rem;cursor:pointer;transition:.18s;user-select:none}
.chip:hover{border-color:var(--ne-orange)}
.chip.on{background:var(--ne-red);color:#fff;border-color:var(--ne-red)}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);max-width:760px;margin:0 auto}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.scorebar div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.scorebar .n{font-size:1.4rem;font-weight:800;color:var(--ne-red)}
.scorebar .l{font-size:.8rem;color:var(--text-soft)}
.nav-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:32px 0 10px}
.nav-buttons a{background:linear-gradient(135deg,var(--ne-red),var(--ne-red-bright));color:#fff;padding:10px 22px;border-radius:999px;text-decoration:none;box-shadow:0 4px 12px rgba(192,57,43,.25);font-size:.92rem;transition:.2s}
.site-footer{text-align:center;color:var(--text-soft);font-size:.84rem;padding:26px 20px 40px;border-top:1px solid var(--line);margin-top:30px}
.brand-footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.brand-logo{display:inline-flex;width:40px;height:40px;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(193,18,31,.22)}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:700;font-size:32px;line-height:1;letter-spacing:.06em;color:#c1121f}
.hero{background:linear-gradient(135deg,var(--ne-red-dark) 0%,var(--ne-red) 45%,var(--ne-orange) 100%);color:#fff;padding:56px 24px 48px;text-align:center;position:relative;overflow:hidden}
.hero h1{margin:0 0 10px;font-size:2.1rem;letter-spacing:.5px}
.hero p{margin:0 auto;max-width:720px;opacity:.95;font-size:1rem}
.unit-wrap{max-width:880px;margin:0 auto;padding:22px 16px 40px}
.unit-header{text-align:center;padding:30px 16px 22px;margin-bottom:18px;background:linear-gradient(135deg,var(--ne-red-dark),var(--ne-red) 60%,var(--ne-orange));color:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.unit-header h1{margin:6px 0 4px;font-size:1.9rem}
</style>
<link rel="preload" as="style" href="css/npi-styles.css" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="css/npi-styles.css"></noscript>
</head>
<body>

<nav class="top-nav">
  <a class="nav-logo" href="index.html">
    <span class="flag"><i style="background:#008C45"></i><i style="background:#F4F5F0"></i><i style="background:#CD212A"></i></span>
    NPI 2 · 意语学习站
  </a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="vocabolario.html">词汇句型</a>

  </div>
</nav>

<main class="page-section">
  <h2>✏️ 自动生成练习</h2>

  <div class="filters" style="position:static">
    <div class="search-row">
      <select id="sel-unit" class="btn ghost" style="background:#fff">
          <option value="all">全部单元</option>
          <option value="00">导论 · Prima di... cominciare</option>
          <option value="01">Unità 1 · Esami... niente stress!</option>
          <option value="02">Unità 2 · Soldi e lavoro</option>
          <option value="03">Unità 3 · In viaggio per l'Italia</option>
          <option value="04">Unità 4 · Un po' di storia</option>
          <option value="05">Unità 5 · Stare bene</option>
          <option value="06">Unità 6 · Andiamo all'opera</option>
          <option value="07">Unità 7 · Andiamo a vivere in campagna</option>
          <option value="08">Unità 8 · Tempo libero e tecnologia</option>
          <option value="09">Unità 9 · L'arte... è di tutti!</option>
          <option value="10">Unità 10 · Paese che vai, problemi che trovi</option>
          <option value="11">Unità 11 · Che bello leggere!</option>
        </select>
      <select id="sel-mode" class="btn ghost" style="background:#fff">
          <option value="mix">混合题型</option>
          <option value="mc_it_zh">选择题：意 → 中</option>
          <option value="mc_zh_it">选择题：中 → 意</option>
          <option value="fill_word">填空：看中文写意语</option>
          <option value="fill_ex">填空：例句补全</option>
        </select>
      <select id="sel-num" class="btn ghost" style="background:#fff">
        <option value="10">10 题</option>
        <option value="20" selected>20 题</option>
        <option value="30">30 题</option>
        <option value="all">不限</option>
      </select>
      <button class="btn" id="btn-start">开始 / 重置</button>
    </div>
    <div class="chip-row">
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="chk-wrong" style="vertical-align:-1px"> 只练错题</label>
      <span class="chip" id="btn-reset" style="cursor:pointer">清空统计</span>
    </div>
  </div>

  <div class="scorebar" style="margin-top:18px">
    <div><div class="n" id="n-asked">0</div><div class="l">累计答题</div></div>
    <div><div class="n" id="n-correct">0</div><div class="l">答对</div></div>
    <div><div class="n" id="n-acc">0%</div><div class="l">正确率</div></div>
    <div><div class="n" id="n-streak">0</div><div class="l">当前连对</div></div>
  </div>
  <div class="progress-line"><i id="progress-fill"></i></div>
  <div style="font-size:.82rem;color:#5D6D7E;margin-top:6px" id="progress-txt">本轮进度 0 / 0</div>

  <div class="quiz-card" style="margin-top:16px">
    <div class="q-meta">
      <span class="q-type" id="q-type">题型</span>
      <span id="q-idx"></span>
    </div>
    <div class="q-prompt" id="q-prompt"></div>
    <div class="q-hint" id="q-hint"></div>
    <div id="q-body"></div>
    <div class="feedback" id="feedback"></div>
    <div class="q-actions">
      <button class="btn" id="btn-next" style="display:none">下一题 →</button>
      <button class="btn ghost" id="btn-skip">跳过</button>
    </div>
  </div>

  <p style="font-size:.86rem;color:#5D6D7E;max-width:760px;margin:18px auto 0">
    · 题目由词库实时生成：选择题（意→中 / 中→意）、看中文拼写单词、例句补全。<br>
    · 判定后即时显示正确答案、词性、音节与例句；统计与错题记录保存在浏览器本地（localStorage）。
  </p>
</main>

<!-- 兜底：捕获静态选项，若任何（旧版）脚本清空下拉框，3 秒内自动回填，杜绝白屏 -->
<script>
(function(){
  var ids=['sel-unit','sel-mode','sel-num'], snap={};
  ids.forEach(function(id){ var s=document.getElementById(id); if(s) snap[id]=s.innerHTML; });
  function ensure(){
    ids.forEach(function(id){
      var s=document.getElementById(id);
      if(s && s.options.length===0 && snap[id]) s.innerHTML=snap[id];
    });
  }
  ensure();
  document.addEventListener('DOMContentLoaded', ensure);
  var _t=setInterval(ensure, 100);
  setTimeout(function(){ clearInterval(_t); }, 3000);
})();
</script>
<script defer src="data/lexicon-index.js"></script>
